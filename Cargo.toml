[package]
name = "frog"
version = "0.1.0"
edition = "2024"

[profile.release]
debug = true
lto = "thin"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
duration-string = { version = "0.5", features = ["serde"] }
serde_json = "1"
walkdir = "2.5.0"
